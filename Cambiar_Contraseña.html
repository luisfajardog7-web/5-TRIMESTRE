<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href= "assets/img/favicon.png" type="image/x_icon">
    <!--link  to the external css file -->
    <link rel="stylesheet" href="assets/css/style.css">

    <title>Cambiar Contraseña</title>
</head>
<body>
    <!--Prelouder-->
    <div class="preloader" id="preloader">
    <div class="spinner">Cargando...</div>
</div>

    <!--Header-->
    <header>
        <h1>Cambiar Contraseña</h1>
        <button class="toggle-button" id="toggle-button">☰</button>
        <nav>
        <ul class="nav-links">
          <li><a href="index.html">Inicio</a></li>
        </ul>
      </nav>
    </header>
        <div class="login-container">
        <form action="/reset-password" method="POST">
            <div class="validation-message" id="validation-message"></div>

            <label for="reset-email">Correo asociado a la cuenta</label>
            <input type="email" id="reset-email" name="email" placeholder="tucorreo@ejemplo.com" required>

            <label for="new-password">Nueva contraseña</label>
            <input type="password" id="new-password" name="password"
                pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).+$"
                title="Mínimo una mayúscula, una minúscula y un número" placeholder="Password" required>

            <label for="confirm-password">Confirmar contraseña</label>
            <input type="password" id="confirm-password" name="confirm_password">

            <button type="submit">Cambiar contraseña</button>
            <p style="text-align:center; margin-top:1rem;">

            </p>
        </form>
    </div>

    <footer>
        <p>&copy; 2024 Your Company. All rights reserved.</p>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
